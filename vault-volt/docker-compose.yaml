services:
    vault-server:
      image: volt-vault:latest
      container_name: volt_vault_ctf
      ports:
        - "4566:4566"
        - "8080:8080"
      environment:
        - SERVICES=s3,iam,lambda,secretsmanager,sts
        - DEFAULT_REGION=eu-central-1
        - ACTIVATE_PRO=0
        - AWS_REQUEST_CHECKSUM_CALCULATION=WHEN_REQUIRED
        - FLAG=${FLAG}